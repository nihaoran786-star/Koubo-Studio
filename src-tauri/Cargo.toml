[package]
name = "koubo-agent"
version = "0.1.0"
description = "口播智能体 Windows desktop app"
authors = ["口播智能体"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "koubo_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
